name: Windows validation
on:
  pull_request:
  push:
  workflow_dispatch:
    inputs:
      signed:
        description: Build a signed release using the release environment certificate
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: windows-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=moderate
      # Runners start at 1024x768 with animations off; the desktop tests expect an ordinary desktop.
      - run: |
          Set-DisplayResolution -Width 1920 -Height 1080 -Force
          Add-Type -Name Spi -Namespace Win32 -MemberDefinition '[DllImport("user32.dll")] public static extern bool SystemParametersInfo(uint action, uint param, IntPtr value, uint flags);'
          [void][Win32.Spi]::SystemParametersInfo(0x1043, 0, [IntPtr]1, 3)
        shell: powershell
      - run: npm run validate
      - run: npm run installer
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: windows-validation
          path: |
            test/output/*.json
            test/output/*.log
            dist/win-unpacked/resources/release.json
          retention-days: 14
      # The unsigned installer from a clean checkout, so releases never come from a working copy.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: windows-installer
          path: |
            dist/zer0ne-Code-Setup-*.exe
            dist/zer0ne-Code-Setup-*.exe.sha256
          if-no-files-found: error
          retention-days: 30
  signed-release:
    if: github.event_name == 'workflow_dispatch' && inputs.signed && github.ref_name == github.event.repository.default_branch
    needs: validate
    runs-on: windows-latest
    environment: release
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: |
          Set-DisplayResolution -Width 1920 -Height 1080 -Force
          Add-Type -Name Spi -Namespace Win32 -MemberDefinition '[DllImport("user32.dll")] public static extern bool SystemParametersInfo(uint action, uint param, IntPtr value, uint flags);'
          [void][Win32.Spi]::SystemParametersInfo(0x1043, 0, [IntPtr]1, 3)
        shell: powershell
      - run: npm run release
        env:
          CSC_LINK: ${{ secrets.WINDOWS_CERTIFICATE }}
          CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: signed-windows-app
          path: |
            dist/win-unpacked/
            dist/zer0ne-Code-Setup-*.exe
            dist/zer0ne-Code-Setup-*.exe.sha256
          retention-days: 14
