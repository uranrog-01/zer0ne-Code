<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Browser lab</title>
	<style>
		body { font: 14px system-ui, sans-serif; margin: 24px; }
		.menu { display: none; }
		.hover-zone:hover .menu { display: block; }
		@media (max-width: 500px) { #layout::after { content: "narrow layout"; } }
	</style>
</head>
<body>
	<h1>Browser lab</h1>
	<select id="size" aria-label="Size"><option value="s">Small</option><option value="m">Medium</option><option value="l">Large</option></select>
	<span id="picked">none</span>
	<button id="alert" onclick="alert('Hello from alert'); document.getElementById('after').textContent = 'alert closed'">Show alert</button>
	<span id="after"></span>
	<div class="hover-zone"><button aria-label="Menu">Menu</button><div class="menu">Hidden menu item</div></div>
	<button id="later" onclick="setTimeout(() => (document.getElementById('late').textContent = 'Loaded late'), 900)">Load later</button>
	<div id="late"></div>
	<a href="browser-lab.html?tab=2" target="_blank">Open in new tab</a>
	<input id="field" aria-label="Field" value="replace me">
	<div id="layout"></div>
	<shadow-box></shadow-box>
	<span id="shadow-out"></span>
	<script>
		document.getElementById('size').addEventListener('change', (e) => (document.getElementById('picked').textContent = 'picked ' + e.target.value));
		customElements.define('shadow-box', class extends HTMLElement { connectedCallback() { const r = this.attachShadow({ mode: 'open' }); const b = document.createElement('button'); b.textContent = 'Inside shadow'; b.onclick = () => (document.getElementById('shadow-out').textContent = 'shadow clicked'); r.appendChild(b); } });
		fetch('/missing-endpoint.json').catch(() => undefined);
	</script>
</body>
</html>
